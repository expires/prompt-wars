<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parts Gallery</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>ai-gaem parts</h1>
      <nav>
        <button data-tab="parts" class="tab active">Parts</button>
        <button data-tab="recipes" class="tab">Recipes</button>
      </nav>
      <div id="filters">
        <select id="cat"><option value="">all categories</option></select>
        <select id="cls"><option value="">all classes</option></select>
        <input id="q" type="search" placeholder="search id / desc / tag" />
        <label><input id="sockets" type="checkbox" /> sockets</label>
        <span id="count"></span>
      </div>
    </header>
    <main>
      <section id="parts" class="grid"></section>
      <section id="recipes" class="grid big" hidden></section>
    </main>
    <div id="viewer" hidden>
      <div class="viewer-head"><span id="viewer-title"></span><button id="viewer-close">close</button></div>
      <canvas id="viewer-canvas"></canvas>
      <pre id="viewer-info"></pre>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
